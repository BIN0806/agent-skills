<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vision review</title>
<link rel="stylesheet" href="review.css">
</head>
<body class="vr">

<header class="vr-head">
  <div class="vr-title">/vision review</div>
  <div class="vr-meta" id="vr-meta"></div>
</header>

<main class="vr-main">

  <section class="vr-draft">
    <span class="vr-label">latest draft · full text</span>
    <article class="vr-doc" id="vr-doc"></article>
  </section>

  <aside class="vr-side">
    <div class="vr-progress"><span>hypotheticals</span><b id="vr-progress"></b></div>
    <div class="vr-stack" id="vr-stack"></div>
    <div class="vr-done" id="vr-done" hidden>
      <h2>Every hypothetical is answered</h2>
      <p class="vr-done-note">Your verdicts are recorded below. Send them back and the agent rebuilds the draft around them for the next round.</p>
      <ul class="vr-ledger" id="vr-ledger"></ul>
      <button type="button" class="vr-send" id="vr-send">Send my verdicts back</button>
      <p class="vr-sent" id="vr-sent" hidden>Sent - the agent is folding these into the next draft.</p>
    </div>
  </aside>

</main>

<script type="application/json" id="vision-data">{{VISION_DATA_JSON}}</script>
<script src="review.js"></script>
</body>
</html>
